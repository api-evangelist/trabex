naftiko: 1.0.0-alpha2
info:
  label: Trabex Trade Compliance API — Documents
  description: 'Trabex Trade Compliance API — Documents. 1 operations. Lead operation: Get Shipment Documents. Self-contained
    Naftiko capability covering one Trabex business surface.'
  tags:
  - Trabex
  - Documents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRABEX_API_KEY: TRABEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: trade-compliance-documents
    baseUri: https://api.trabex.io
    description: Trabex Trade Compliance API — Documents business capability. Self-contained, no shared references.
    resources:
    - name: v1-documents-shipmentId
      path: /v1/documents/{shipmentId}
      operations:
      - name: getshipmentdocuments
        method: GET
        description: Get Shipment Documents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.TRABEX_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: trade-compliance-documents-rest
    port: 8080
    description: REST adapter for Trabex Trade Compliance API — Documents. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/documents/{shipmentid}
      name: v1-documents-shipmentid
      description: REST surface for v1-documents-shipmentId.
      operations:
      - method: GET
        name: getshipmentdocuments
        description: Get Shipment Documents
        call: trade-compliance-documents.getshipmentdocuments
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: trade-compliance-documents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trabex Trade Compliance API — Documents. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-shipment-documents
      description: Get Shipment Documents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trade-compliance-documents.getshipmentdocuments
      outputParameters:
      - type: object
        mapping: $.
